<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Tasks list{% endblock %}</title>
    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
        }
        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 0;
            border-bottom: 1px solid #34495e;
        }
        .sidebar a:hover {
            color: #1abc9c;
        }
        .main-content {
            flex: 1;
            padding: 30px;
            background-color: #f9f9f9;
        }
        .task-link {
            text-decoration: none;
            color: #2c3e50;
        }

        .task-link:hover {
            color: #3498db;
        }

        .task-done {
            color: green;
        }

         .task-not-done {
            color: red;
        }

    </style>
</head>
<body>
    <div class="sidebar">
        <nav>
            <a href="{% url 'tasks:task-list' %}">Home</a>
            <a href="{% url 'tasks:tag-list' %}">Tag List</a>
        </nav>
    </div>

    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
