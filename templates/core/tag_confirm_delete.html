{% extends 'base.html' %}


{% block content %}
    <h1>Delete tag</h1>

    <p>Are you sure you want to delete <strong>"{{ object.name }}"</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <div class="delete-buttons">
            <button type="submit" class="danger-delete-button">Yes, delete</button>
            <div>
                <a href="{% url 'tasks:tag-list' %}" class="cancel-button">Cancel</a>
            </div>

        </div>

    </form>
{% endblock %}
