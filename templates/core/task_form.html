{% extends 'base.html' %}

{% block content %}
    <h1>{% if object %}Edit task{% else %}Create task{% endif %}</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button task-tag-save-button">
            Save task
        </button>
    </form>
{% endblock %}
