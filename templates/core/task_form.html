{% extends 'base.html' %}

{% block content %}
    <h1>{% if object %}Edit task{% else %}Create task{% endif %}</h1>

    <form action="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 20px 20px; background-color: #3498db; border-radius: 10px; color: white; border: none;";>
            Save task
        </button>
    </form>
{% endblock %}
