<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tasks List</title>
</head>
<body>
    <h1>Tasks list</h1>
    <ul>
        {% for task in tasks %}
            <li>
                <strong>task.content</strong>
                {% if task.tags %}
                    <small> Tags:
                        {% for tag in task.tags.all %}
                            {{ tag.name }}
                        {% endfor %}
                    </small>
            </li>
        {% empty %}
            <li>There is no tasks to show.</li>
        {% endfor %}
    </ul>
</body>
</html>
